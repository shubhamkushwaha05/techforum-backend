# ── Server ────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
spring.application.name=techforum

# ── Database ──────────────────────────────────────────────
# FIX: Credentials moved to environment variables.
# Set DB_URL, DB_USERNAME, DB_PASSWORD in your OS env or Docker -e flags.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/techforum}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# FIX: show-sql=false in production; enable via env var in dev only
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ───────────────────────────────────────────────────
# FIX: Secret moved to env var. Must be >= 32 chars (256 bits) for HS256.
# Generate with: openssl rand -base64 32
jwt.secret=${JWT_SECRET:thisIsADevelopmentSecretKeyThatMustBeReplacedInProduction1!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Logging ───────────────────────────────────────────────
logging.level.com.techforum=INFO
logging.level.org.springframework.security=WARN

# ── CORS ──────────────────────────────────────────────────
# Fix 6: Set CORS_ALLOWED_ORIGINS in production to your actual frontend domain
# e.g. CORS_ALLOWED_ORIGINS=https://techforum.yourdomain.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
