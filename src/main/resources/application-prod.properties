# ── Production Profile ────────────────────────────────────
# Activated with: SPRING_PROFILES_ACTIVE=prod
# All values come from environment variables set in Railway/Render dashboard.

# ── Server ────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuned for cloud (smaller than local)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── Hibernate ─────────────────────────────────────────────
# Use 'validate' in production — schema changes via migration tools only
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS ──────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ── Logging ───────────────────────────────────────────────
logging.level.com.techforum=WARN
logging.level.org.springframework.security=WARN
logging.level.root=WARN
